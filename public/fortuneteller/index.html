<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GET RFID Fortune Teller</title>
  <meta name="description" content="輸入暱稱，選擇問題與占卜方式，抽一則今日占卜。" />
  <link rel="stylesheet" href="/fortuneteller/styles.css" />
</head>
<body class="fortune-page">
  <main class="fortune-shell">
    <section class="fortune-stage" aria-labelledby="fortuneTitle">
      <div class="brand-row">
        <a href="/" class="brand-link">GET RFID</a>
        <a href="/fortuneteller/admin" class="admin-link">Admin</a>
      </div>

      <div class="flow-steps" aria-label="占卜流程">
        <span class="flow-step flow-step--setup">1 設定</span>
        <span class="flow-step flow-step--ritual">2 占卜</span>
        <span class="flow-step flow-step--result">3 結果</span>
      </div>

      <div class="experience-grid">
        <section class="setup-panel" aria-label="占卜設定">
          <header class="hero-copy">
            <h1 id="fortuneTitle">今日小占卜 · 抽個方向</h1>
          </header>

          <form id="fortuneForm" class="fortune-form">
            <label class="field-label" for="nameInput">你的名字或暱稱</label>
            <input id="nameInput" name="name" type="text" maxlength="40" autocomplete="name" placeholder="例如：小林" required />

            <fieldset class="choice-group">
              <legend>問題類型</legend>
              <div class="topic-grid">
                <label class="topic-card">
                  <input type="radio" name="topic" value="love" checked />
                  <span class="topic-icon">❤️</span>
                  <span class="topic-copy">
                    <span class="topic-title">這關係還有戲嗎</span>
                    <span class="topic-type">姻緣</span>
                  </span>
                </label>
                <label class="topic-card">
                  <input type="radio" name="topic" value="career" />
                  <span class="topic-icon">💼</span>
                  <span class="topic-copy">
                    <span class="topic-title">工作是不是有病</span>
                    <span class="topic-type">事業</span>
                  </span>
                </label>
                <label class="topic-card">
                  <input type="radio" name="topic" value="money" />
                  <span class="topic-icon">💰</span>
                  <span class="topic-copy">
                    <span class="topic-title">該不該衝</span>
                    <span class="topic-type">決策</span>
                  </span>
                </label>
                <label class="topic-card">
                  <input type="radio" name="topic" value="study" />
                  <span class="topic-icon">📕</span>
                  <span class="topic-copy">
                    <span class="topic-title">這題選什麼</span>
                    <span class="topic-type">學業</span>
                  </span>
                </label>
                <label class="topic-card">
                  <input type="radio" name="topic" value="food" />
                  <span class="topic-icon">🍜</span>
                  <span class="topic-copy">
                    <span class="topic-title">要吃什麼</span>
                    <span class="topic-type">日常</span>
                  </span>
                </label>
                <label class="topic-card">
                  <input type="radio" name="topic" value="travel" />
                  <span class="topic-icon">✈️</span>
                  <span class="topic-copy">
                    <span class="topic-title">去不去</span>
                    <span class="topic-type">行動</span>
                  </span>
                </label>
                <label class="topic-card">
                  <input type="radio" name="topic" value="decision" />
                  <span class="topic-icon">🎲</span>
                  <span class="topic-copy">
                    <span class="topic-title">幫我決定</span>
                    <span class="topic-type">隨機</span>
                  </span>
                </label>
                <label class="topic-card">
                  <input type="radio" name="topic" value="roast" />
                  <span class="topic-icon">☠️</span>
                  <span class="topic-copy">
                    <span class="topic-title">隨便吐槽</span>
                    <span class="topic-type">隨機</span>
                  </span>
                </label>
              </div>
            </fieldset>

            <fieldset class="choice-group">
              <legend>占卜方式</legend>
              <div class="method-grid">
                <label class="method-card">
                  <input type="radio" name="method" value="bagua" checked />
                  <span class="method-title">八卦占卜</span>
                  <span class="method-desc">銅錢起卦，抽八象方向</span>
                </label>
                <label class="method-card">
                  <input type="radio" name="method" value="tarot" />
                  <span class="method-title">塔羅牌</span>
                  <span class="method-desc">洗牌抽牌，讀今日訊息</span>
                </label>
              </div>
            </fieldset>

            <fieldset class="choice-group">
              <legend>誰來動手</legend>
              <div class="draw-grid">
                <label class="draw-card">
                  <input type="radio" name="drawMode" value="auto" checked />
                  <span class="method-title">系統代抽</span>
                  <span class="method-desc">你負責問，系統負責裝神祕</span>
                </label>
                <label class="draw-card">
                  <input type="radio" name="drawMode" value="manual" />
                  <span class="method-title">自己來</span>
                  <span class="method-desc">點龜殼或抽牌，自己把命運叫醒</span>
                </label>
              </div>
            </fieldset>

            <button id="submitButton" class="primary-button" type="submit">開始占卜</button>
          </form>
        </section>

        <section class="ritual-panel" aria-label="占卜與結果">
          <div class="ritual-scene method--bagua" id="ritualScene" aria-label="占卜動畫區">
            <div class="ritual-aura"></div>
            <div class="coin-set is-idle" id="coinSet">
              <button class="turtle-shell" id="turtleShell" type="button" aria-label="丟銅板">
                <span class="turtle-shell__ridge"></span>
                <span class="turtle-shell__label">龜殼</span>
              </button>
              <div class="coin-orbit coin-a">
                <div class="coin" data-face="front">
                  <div class="coin__inner">
                    <div class="coin__face coin__face--front">
                      <span class="coin__glyph">陽</span>
                      <span class="coin__mark">乾</span>
                    </div>
                    <div class="coin__face coin__face--back">
                      <span class="coin__glyph">陰</span>
                      <span class="coin__mark">坤</span>
                    </div>
                  </div>
                  <span class="coin__shadow"></span>
                </div>
              </div>
              <div class="coin-orbit coin-b">
                <div class="coin" data-face="back">
                  <div class="coin__inner">
                    <div class="coin__face coin__face--front">
                      <span class="coin__glyph">陽</span>
                      <span class="coin__mark">乾</span>
                    </div>
                    <div class="coin__face coin__face--back">
                      <span class="coin__glyph">陰</span>
                      <span class="coin__mark">坤</span>
                    </div>
                  </div>
                  <span class="coin__shadow"></span>
                </div>
              </div>
              <div class="coin-orbit coin-c">
                <div class="coin" data-face="front">
                  <div class="coin__inner">
                    <div class="coin__face coin__face--front">
                      <span class="coin__glyph">陽</span>
                      <span class="coin__mark">乾</span>
                    </div>
                    <div class="coin__face coin__face--back">
                      <span class="coin__glyph">陰</span>
                      <span class="coin__mark">坤</span>
                    </div>
                  </div>
                  <span class="coin__shadow"></span>
                </div>
              </div>
              <div class="trigram-result" id="trigramResult">
                <span id="trigramSymbol">☰</span>
                <div class="hexagram-lines" id="hexagramLines" aria-hidden="true"></div>
                <strong id="trigramName">乾象</strong>
                <small id="trigramTone">先別腦補，卦會自己招。</small>
              </div>
            </div>
            <div class="card-set is-idle" id="cardSet" hidden>
              <div class="tarot-deck" aria-hidden="true">
                <span></span>
                <span></span>
                <span></span>
              </div>
              <div class="tarot-card card-a" data-card="star">
                <div class="tarot-card__inner">
                  <div class="tarot-card__face tarot-card__back"></div>
                  <div class="tarot-card__face tarot-card__front">
                    <span class="tarot-card__title">星星</span>
                    <span class="tarot-card__symbol">✦</span>
                    <span class="tarot-card__keyword">希望 / 別再拖</span>
                  </div>
                </div>
              </div>
              <div class="tarot-card card-b is-selected" data-card="moon">
                <div class="tarot-card__inner">
                  <div class="tarot-card__face tarot-card__back"></div>
                  <div class="tarot-card__face tarot-card__front">
                    <span class="tarot-card__title">待抽</span>
                    <span class="tarot-card__symbol">☾</span>
                    <span class="tarot-card__keyword">宇宙想嘴你</span>
                  </div>
                </div>
              </div>
              <div class="tarot-card card-c" data-card="sun">
                <div class="tarot-card__inner">
                  <div class="tarot-card__face tarot-card__back"></div>
                  <div class="tarot-card__face tarot-card__front">
                    <span class="tarot-card__title">太陽</span>
                    <span class="tarot-card__symbol">☀</span>
                    <span class="tarot-card__keyword">亮起來 / 少裝忙</span>
                  </div>
                </div>
              </div>
            </div>
            <button class="ritual-action" id="ritualAction" type="button" hidden>點龜殼丟銅板</button>
          </div>
          <p id="statusMessage" class="status-message" role="status"></p>

          <section id="resultPanel" class="result-panel" aria-live="polite" hidden>
            <p id="resultMeta" class="result-meta"></p>
            <h2 id="resultTitle"></h2>
            <p id="resultKeywords" class="keywords"></p>
            <p id="resultText" class="result-text"></p>
            <div id="sharePanel" class="share-panel" hidden>
              <label class="share-link-label" for="shareLinkInput">分享連結</label>
              <div class="share-link-row">
                <input id="shareLinkInput" class="share-link-input" type="text" readonly />
                <button id="copyLinkButton" class="secondary-button" type="button">複製連結</button>
              </div>
              <div class="share-actions" aria-label="分享平台">
                <button id="nativeShareButton" class="secondary-button" type="button">系統分享</button>
                <button class="secondary-button" data-share-platform="facebook" type="button">Facebook</button>
                <button class="secondary-button" data-share-platform="threads" type="button">Threads</button>
                <button class="secondary-button" data-share-platform="line" type="button">LINE</button>
              </div>
            </div>
            <div class="result-actions">
              <button id="copyButton" class="secondary-button" type="button">複製結果</button>
              <button id="resetButton" class="secondary-button" type="button">再問一次</button>
            </div>
          </section>
        </section>
      </div>
    </section>
  </main>
  <script src="/fortuneteller/app.js" defer></script>
</body>
</html>
