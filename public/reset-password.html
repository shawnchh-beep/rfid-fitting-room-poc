<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設定新密碼</title>
</head>
<body>
  <main>
    <label for="lang" data-i18n="common.language">語言</label>
    <select id="lang">
      <option value="en">English</option>
      <option value="zh-Hant">繁體中文</option>
      <option value="zh-Hans">简体中文</option>
      <option value="ja">日本語</option>
    </select>

    <h1 data-i18n="reset.title">設定新密碼</h1>

    <form id="reset-form">
      <div>
        <label for="password" data-i18n="reset.password">新密碼</label><br />
        <input id="password" type="password" autocomplete="new-password" required />
      </div>
      <br />
      <div>
        <label for="confirmPassword" data-i18n="reset.confirmPassword">確認新密碼</label><br />
        <input id="confirmPassword" type="password" autocomplete="new-password" required />
      </div>
      <br />
      <button type="submit" data-i18n="reset.submit">更新密碼</button>
    </form>

    <p class="auth-contact-hint">
      <span data-i18n="contact.inline">有問題請聯繫</span>
      <a href="mailto:contact@getrfid.link">contact@getrfid.link</a>
    </p>
    <p id="message"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module">
    import { applyI18n, bindLangSelect, createAuthClient, t } from '/js/auth-page-utils.js';

    const form = document.getElementById('reset-form');
    const message = document.getElementById('message');
    const langSelect = document.getElementById('lang');

    applyI18n();
    bindLangSelect(langSelect);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';

      const password = String(document.getElementById('password')?.value || '');
      const confirmPassword = String(document.getElementById('confirmPassword')?.value || '');

      if (password.length < 8) {
        message.textContent = t('reset.error.minLength');
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = t('reset.error.mismatch');
        return;
      }

      const authClient = createAuthClient();
      const { error } = await authClient.auth.updateUser({ password });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent = t('reset.success');
      setTimeout(() => {
        window.location.href = '/login.html';
      }, 1200);
    });
  </script>
</body>
</html>
