<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>忘記密碼</title>
</head>
<body>
  <main>
    <label for="lang" data-i18n="common.language">語言</label>
    <select id="lang">
      <option value="en">English</option>
      <option value="zh-Hant">繁體中文</option>
      <option value="zh-Hans">简体中文</option>
      <option value="ja">日本語</option>
    </select>

    <h1 data-i18n="forgot.title">忘記密碼</h1>

    <form id="forgot-form">
      <div>
        <label for="email" data-i18n="login.email">Email</label><br />
        <input id="email" type="email" autocomplete="username" required />
      </div>
      <br />
      <button type="submit" data-i18n="forgot.submit">寄送重設密碼信</button>
    </form>

    <p><a href="/login.html" data-i18n="login.submit">登入</a></p>
    <p class="auth-contact-hint">
      <span data-i18n="contact.inline">有問題請聯繫</span>
      <a href="mailto:contact@getrfid.link">contact@getrfid.link</a>
    </p>
    <p id="message"></p>
  </main>

  <script type="module">
    import { applyI18n, bindLangSelect, t } from '/js/auth-page-utils.js';

    const form = document.getElementById('forgot-form');
    const message = document.getElementById('message');
    const langSelect = document.getElementById('lang');

    applyI18n();
    bindLangSelect(langSelect);

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      message.textContent = '';

      const email = String(document.getElementById('email')?.value || '').trim();

      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });

      const data = await res.json();

      if (!res.ok) {
        message.textContent = data?.error || t('forgot.error.default');
        return;
      }

      message.textContent = t('forgot.success');
    });
  </script>
</body>
</html>
